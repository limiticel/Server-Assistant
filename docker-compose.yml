services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: server_assistant
      POSTGRES_USER: server_assistant
      POSTGRES_PASSWORD: server_assistant
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"

  backend:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      - postgres
      - redis
    environment:
      APP_PORT: 48118
      DATABASE_URL: postgres://server_assistant:server_assistant@postgres:5432/server_assistant?options=-csearch_path%3Dserver_assistant%2Cpublic
      CORS_ORIGINS: http://localhost:48117
      REDIS_URL: redis://redis:6379/0
    ports:
      - "48118:48118"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "48117:80"

volumes:
  postgres_data:
